*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f5f7f6;font-family:"IBM Plex Sans",sans-serif;color:#18242b;position:relative;overflow:hidden}
.wrap{position:absolute;inset:0;padding:64px 72px;display:grid;grid-template-columns:1fr 430px;gap:48px;align-items:center}

.card h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#5d6b72;font-weight:500;margin-bottom:14px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #e6ebe9;font-size:19px}
.row b{font-weight:600}.row .n{font-family:"IBM Plex Mono";color:#5d6b72;font-size:16px}
.row .p{font-family:"IBM Plex Mono";font-weight:500}
.row.best{background:#dcefe9;margin:0 -24px;padding:12px 24px;border-top-color:#dcefe9}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font-size:15px;border:1.5px solid #0c6b5a;color:#0c6b5a;border-radius:99px;padding:4px 12px;background:#fff}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#0c6b5a}
